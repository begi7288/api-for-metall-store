name: metall-store-api
region: fra
services:
- name: api
  github:
    branch: main
    deploy_on_push: true
    repo: begi7288/api-for-metall-store
  dockerfile_path: Dockerfile
  http_port: 8000
  instance_count: 1
  instance_size_slug: basic-xxs
  run_command: python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 3 temirdokon_v1.wsgi:application
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db.DATABASE_URL}
  - key: SECRET_KEY
    scope: RUN_TIME
    value: django-insecure-prod-key-change-me
  - key: DEBUG
    scope: RUN_TIME
    value: "False"
  - key: ALLOWED_HOSTS
    scope: RUN_TIME
    value: "*"
databases:
- engine: PG
  name: db
  num_nodes: 1
  size: db-s-dev-database
  version: "15"
